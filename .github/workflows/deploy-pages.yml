name: Deploy interactive PMKP workspace

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - playbook-seed.gz.b64
      - .nojekyll
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare app and Playbook data
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp playbook-seed.gz.b64 _site/playbook-seed.gz.b64
          touch _site/.nojekyll
      - name: Verify deployment artifacts
        run: |
          test -s _site/index.html
          test -s _site/playbook-seed.gz.b64
          echo "App bytes: $(wc -c < _site/index.html)"
          echo "Playbook seed bytes: $(wc -c < _site/playbook-seed.gz.b64)"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
