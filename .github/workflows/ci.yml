name: PMKP static release validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pmkp-static-ci
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate app and seed presence
        run: |
          test -s index.html
          test -s playbook-seed.gz.b64
      - name: Syntax-check deployed application JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script([^>]*)>(.*?)</script>', html, flags=re.I | re.S)
          inline = [body for attrs, body in scripts if 'src=' not in attrs.lower() and body.strip()]
          if len(inline) != 1:
              raise SystemExit(f'Expected one inline application script, found {len(inline)}')
          if 'pmkp-bootstrap-admin' not in html or 'pmkp-evidence' not in html:
              raise SystemExit('Required Supabase authentication or evidence-storage integration is missing')
          if 'function preferredDocs' not in html or 'function openEvidenceViewer' not in html or '.viewerpanel' not in html:
              raise SystemExit('Playbook source fallback or private evidence viewer is missing')
          if 'function progressFor(list){let done=0,total=0;' not in html:
              raise SystemExit('Progress must be calculated from actual checklist item counts')
          if 'const found=candidates.find(d=>stdCodeById.get(d.standardId)===x.stdCode);' not in html:
              raise SystemExit('Seed reconciliation must match the standard, not just title and page')
          if 'data-status-filter="' in html or 'id="taskSearch"' in html:
              raise SystemExit('Redundant duplicate checklist filters/search controls remain')
          if html.count('playbookKey:"PMKP41-') != 8:
              raise SystemExit('The eight PMKP 4.1 checklist records are incomplete')
          Path('/tmp/pmkp-inline.js').write_text(inline[0], encoding='utf-8')
          PY
          node --check /tmp/pmkp-inline.js
      - name: Validate source seed integrity
        run: |
          python3 - <<'PY'
          import base64, gzip, json
          from pathlib import Path
          packed = base64.b64decode(Path('playbook-seed.gz.b64').read_text().strip(), validate=True)
          data = json.loads(gzip.decompress(packed))
          keys = [row.get('playbookKey') for row in data]
          if len(data) != 138 or any(not k for k in keys) or len(set(keys)) != len(keys):
              raise SystemExit(f'Invalid source seed count or keys: {len(data)} rows')
          required = {'stdCode','elementCode','title','sourcePage','implementation','adminDocs'}
          if any(not required.issubset(row) for row in data):
              raise SystemExit('A source seed row is missing required Playbook fields')
          print('Validated 138 extracted rows plus 8 PMKP 4.1 supplement rows = 146 checklist activities.')
          PY
      - name: Validate database release migrations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          expected = {
              'supabase/migrations/20261013064356_pmkp_release_security_hardening.sql': [
                  'REVOKE ALL ON FUNCTION public.pmkp_guard_auth_user()', 'pmkp_attachment_insert_own',
                  'PMKP evidence upload authenticated', 'pmkp_standard_admin_write'
              ],
              'supabase/migrations/20261013074509_pmkp_release_policy_optimization.sql': [
                  'pmkp_standard_read_authenticated', 'pmkp_activity_insert'
              ],
              'supabase/migrations/20261013074533_pmkp_release_remove_duplicate_policies.sql': [
                  'pmkp_standard_admin_insert', 'pmkp_standard_admin_update', 'pmkp_standard_admin_delete'
              ],
              'supabase/migrations/20261013074756_pmkp_storage_allow_webp.sql': [
                  "ARRAY['image/webp']"
              ],
          }
          for file, tokens in expected.items():
              path = Path(file)
              if not path.is_file():
                  raise SystemExit(f'Missing release migration source: {file}')
              sql = path.read_text(encoding='utf-8')
              for token in tokens:
                  if token not in sql:
                      raise SystemExit(f'Missing migration token {token!r} in {file}')
          print('Validated release hardening, policy cleanup, and private evidence storage migrations.')
          PY
