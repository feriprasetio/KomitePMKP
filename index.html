async function readSeed(){
 if(seedCache)return seedCache;
 const response=await fetch(ROOT+"playbook-seed.gz.b64",{cache:"force-cache"});
 if(!response.ok)throw new Error("Data Playbook belum tersedia pada deployment.");
 const b64=(await response.text()).replace(/\s/g,"");
 if(!("DecompressionStream" in window))throw new Error("Browser ini belum mendukung pembacaan seed terkompresi. Gunakan Firefox/Chrome terbaru.");
 const binary=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
 const stream=new Blob([binary]).stream().pipeThrough(new DecompressionStream("gzip"));
 seedCache=JSON.parse(await new Response(stream).text());return seedCache;
}

async function ensureSeeded(){
 const timestamp=nowISO();
 let st=await db.from("PmkpStandard").select("*").order("sortOrder");
 if(st.error)throw st.error;
 if(!st.data||st.data.length===0){
  const rows=standardsMeta.map((s,i)=>({id:"std_pmkp_"+String(i+1).padStart(2,"0"),code:s[0],title:s[1],description:s[2],color:"#0f766e",sortOrder:i+1,createdAt:timestamp,updatedAt:timestamp}));

 for(const x of raw){
  const page=pdfPageFromPrinted(x.sourcePage);
  const title=normalizeTitle(x.title);
  const candidates=existing.filter(d=>!used.has(d.id)&&normalizeTitle(d.title||d.subTopic)===title&&Number(d.sourcePage)===page);
  const found=candidates.find(d=>stdCodeById.get(d.standardId)===x.stdCode)||candidates[0];
  if(!found){unmatched.push(x);continue}
  used.add(found.id);
  const checks=found.checklistData&&typeof found.checklistData==="object"?found.checklistData:{checks:{},version:1};
  enriched.push({...found,playbookKey:x.playbookKey,elementCode:String(x.elementCode||found.elementCode||"").toLowerCase(),criterion:x.criterion||found.criterion||"",programSuggestion:x.programSuggestion||found.programSuggestion||"",implementation:x.implementation||found.implementation||"",sourcePage:page,regulasiDocs:x.regulation||found.regulasiDocs||"",adminDocs:x.adminDocs||found.adminDocs||"",pendukungDocs:x.facility||found.pendukungDocs||"",checklistData:checks,updatedAt:timestamp});
 }
 for(let off=0;off<enriched.length;off+=20){
  const saved=await db.from("PmkpDocument").upsert(enriched.slice(off,off+20),{onConflict:"id"});if(saved.error)throw saved.error;
 }
 // If the database already contains a Playbook dataset, only add items that cannot
 // be matched by both title and source page; retain all existing IDs and checklist state.
 if(existing.length){
  const stillMissing=unmatched.filter(x=>!existing.some(d=>normalizeTitle(d.title||d.subTopic)===normalizeTitle(x.title)&&Number(d.sourcePage)===pdfPageFromPrinted(x.sourcePage)));
  for(let off=0;off<stillMissing.length;off+=20){
   const rows=stillMissing.slice(off,off+20).map(x=>{
    const id=stdIdByCode.get(x.stdCode);
    if(!id)throw new Error("Standar Playbook tidak terdaftar: "+x.stdCode);
    return {id:x.playbookKey,playbookKey:x.playbookKey,stdCode:x.stdCode,standardId:id,elementCode:String(x.elementCode||"").toLowerCase(),criterion:x.criterion||"",subTopic:x.title,title:x.title,description:x.criterion||"",programSuggestion:x.programSuggestion||"",implementation:x.implementation||"",sourcePage:pdfPageFromPrinted(x.sourcePage),regulasiDocs:x.regulation||"",adminDocs:x.adminDocs||"",pendukungDocs:x.facility||"",checklistData:{checks:{},version:1},sortOrder:existing.length+off+1,status:"todo",progress:0,priority:"Sedang",createdAt:timestamp,updatedAt:timestamp};
   });
   const saved=await db.from("PmkpDocument").upsert(rows,{onConflict:"playbookKey",ignoreDuplicates:true});if(saved.error)throw saved.error;
  }
  return;
 }
 for(let off=0;off<raw.length;off+=20){
  const rows=raw.slice(off,off+20).map((x,index)=>{
   const id=stdIdByCode.get(x.stdCode);
   if(!id)throw new Error("Standar Playbook tidak terdaftar: "+x.stdCode);
   return {id:x.playbookKey,playbookKey:x.playbookKey,stdCode:x.stdCode,standardId:id,elementCode:String(x.elementCode||"").toLowerCase(),criterion:x.criterion||"",subTopic:x.title,title:x.title,description:x.criterion||"",programSuggestion:x.programSuggestion||"",implementation:x.implementation||"",sourcePage:pdfPageFromPrinted(x.sourcePage),regulasiDocs:x.regulation||"",adminDocs:x.adminDocs||"",pendukungDocs:x.facility||"",checklistData:{checks:{},version:1},sortOrder:off+index+1,status:"todo",progress:0,priority:"Sedang",createdAt:timestamp,updatedAt:timestamp};
  });
  const saved=await db.from("PmkpDocument").upsert(rows,{onConflict:"playbookKey",ignoreDuplicates:true});if(saved.error)throw saved.error;
 }
}

function renderRepository(){
 const files=attachments.filter(a=>repoFilter==="all"||a.category===repoFilter).filter(a=>{if(!searchText)return true;const d=docs.find(x=>x.id===a.documentId);return [a.filename,a.category,a.description,a.uploadedBy,d&&d.title,d&&d.stdCode].join(" ").toLowerCase().includes(searchText.toLowerCase())});

 return '<section class="pagehead"><div><div class="eyebrow">Repository bukti akreditasi</div><h1>Repository Bukti</h1><p>Unggah, pratinjau dan unduh dokumen yang terhubung ke aktivitas Playbook. Berkas disimpan secara privat.</p></div><span class="tag admin">Privat · sesi login diperlukan</span></section><section class="repo-summary"><div class="reposum"><strong>'+attachments.length+'</strong><span>Berkas tersimpan</span></div><div class="reposum"><strong>'+size+' MB</strong><span>Total ukuran metadata berkas</span></div><div class="reposum"><strong>'+new Set(attachments.map(a=>a.documentId)).size+'</strong><span>Aktivitas dengan bukti</span></div></section><section class="grid" style="grid-template-columns:minmax(0,.85fr) minmax(0,1.3fr);align-items:start"><div class="card cardpad"><div class="paneltitle">Unggah bukti baru</div><div class="paneldesc" style="margin-bottom:14px">Berkas dihubungkan dengan salah satu subtopik Playbook agar dapat ditelusuri.</div><form id="libraryUploadForm" class="grid" style="gap:12px"><div class="field"><label>Aktivitas Playbook</label><select name="documentId" required><option value="">Pilih aktivitas…</option>'+docs.map(d=>'<option value="'+esc(d.id)+'">'+esc(d.stdCode)+' · '+esc(d.title)+'</option>').join("")+'</select></div><div class="twocol"><div class="field"><label>Kategori bukti</label><select name="category">'+['Dokumen Administratif','Regulasi','Bukti Implementasi','Hasil Monitoring/RTL','Lainnya'].map(x=>'<option>'+x+'</option>').join("")+'</select></div><div class="field"><label>Keterangan (opsional)</label><input name="description" placeholder="Versi, periode, atau catatan"></div></div><div class="field"><label>Pilih berkas (maks. 20 MB)</label><input type="file" name="file" required accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.png,.jpg,.jpeg,.webp"></div><div class="tiny">Gunakan nama file yang jelas, misalnya: PMKP-01_Perdir-Tata-Kelola_2026.pdf. Hindari identitas pasien pada nama berkas.</div><button class="btn primary" type="submit">↑ Unggah ke repository privat</button></form></div><div class="card cardpad"><div class="between"><div><div class="paneltitle">Berkas bukti</div><div class="paneldesc">Buka pratinjau melalui signed URL sementara.</div></div><div class="field" style="min-width:160px"><label>Kategori</label><select id="repoFilter"><option value="all">Semua kategori</option>'+['Dokumen Administratif','Regulasi','Bukti Implementasi','Hasil Monitoring/RTL','Lainnya'].map(x=>'<option '+(repoFilter===x?"selected":"")+'>'+x+'</option>').join("")+'</select></div></div><div style="margin-top:14px;display:flex;flex-direction:column;gap:8px">'+(files.length?files.map(a=>{const d=docs.find(x=>x.id===a.documentId);return '<div class="evidenceitem"><div class="fileicon">'+fileIcon(a.mimeType,a.filename)+'</div><div class="filebody"><strong>'+esc(a.filename)+'</strong><small>'+esc(a.category||"Bukti Pendukung")+' · '+esc(d?d.stdCode+" — "+d.title:"Aktivitas tidak ditemukan")+'</small><small>'+formatSize(a.fileSize)+' · '+dateTime(a.createdAt)+'</small></div><button class="iconbtn" data-view-file="'+esc(a.id)+'" title="Pratinjau / unduh">↗</button></div>'}).join(""):'<div class="empty"><strong>Belum ada berkas</strong>Unggah bukti menggunakan formulir di sebelah kiri.</div>')+'</div></div></section>';

function fileIcon(mime,name){const n=String(name||"").toLowerCase();if((mime||"").includes("pdf")||n.endsWith(".pdf"))return "PDF";if(/\.(doc|docx)$/.test(n))return "DOC";if(/\.(xls|xlsx|csv)$/.test(n))return "XLS";if(/\.(ppt|pptx)$/.test(n))return "PPT";if(/\.(png|jpg|jpeg|webp)$/.test(n))return "IMG";return "FILE"}
function formatSize(v){const n=Number(v)||0;if(n<1024)return n+" B";if(n<1024*1024)return (n/1024).toFixed(0)+" KB";return (n/1024/1024).toFixed(1)+" MB"}

}
function taskMetaForm(d){return '<form id="taskMetaForm" class="grid" style="gap:11px;margin-top:13px"><div class="twocol"><div class="field"><label>Penanggung jawab / PIC</label><input name="pic" value="'+esc(d.pic||"")+'" placeholder="Nama/jabatan"></div><div class="field"><label>Prioritas</label><select name="priority">'+["Tinggi","Sedang","Rendah"].map(x=>'<option '+((d.priority||"Sedang")===x?"selected":"")+'>'+x+'</option>').join("")+'</select></div><div class="field"><label>Target waktu</label><input type="date" name="dueDate" value="'+esc(d.dueDate?String(d.dueDate).slice(0,10):"")+'"></div><div class="field"><label>Status review</label><select name="status"><option value="todo" '+(d.status==="todo"?"selected":"")+'>Belum dimulai</option><option value="in_progress" '+(d.status==="in_progress"?"selected":"")+'>Dalam proses</option><option value="review" '+(d.status==="review"?"selected":"")+'>Perlu review</option><option value="done" '+(d.status==="done"?"selected":"")+'>Selesai (berdasarkan checklist)</option></select></div></div><div class="field"><label>Catatan tindak lanjut</label><textarea name="notes" placeholder="Hambatan, keputusan, periode, atau rencana tindak lanjut">'+esc(d.notes||"")+'</textarea></div><button class="btn primary" type="submit">Simpan detail</button></form>'}
function taskUploadBox(d,files){return '<section class="uploadbox"><div class="paneltitle">Unggah bukti untuk aktivitas ini</div><div class="paneldesc" style="margin:4px 0 12px">PDF, Office, teks atau gambar · maksimal 20 MB per berkas.</div><form class="grid" id="taskUploadForm" data-doc-id="'+esc(d.id)+'" style="gap:10px"><div class="twocol"><div class="field"><label>Kategori</label><select name="category">'+['Dokumen Administratif','Regulasi','Bukti Implementasi','Hasil Monitoring/RTL','Lainnya'].map(x=>'<option>'+x+'</option>').join("")+'</select></div><div class="field"><label>Keterangan</label><input name="description" placeholder="Periode / nomor regulasi"></div></div><div class="field"><label>File</label><input type="file" name="file" required accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.png,.jpg,.jpeg,.webp"></div><button class="btn primary" type="submit">↑ Unggah bukti</button></form></section><section class="card cardpad"><div class="between"><div><div class="paneltitle">Bukti terhubung</div><div class="paneldesc">Berkas yang terhubung ke subtopik ini.</div></div><span class="tag">'+files.length+' berkas</span></div><div style="display:flex;flex-direction:column;gap:8px;margin-top:11px">'+(files.length?files.map(a=>'<div class="evidenceitem"><div class="fileicon">'+fileIcon(a.mimeType,a.filename)+'</div><div class="filebody"><strong>'+esc(a.filename)+'</strong><small>'+esc(a.category||"Bukti Pendukung")+' · '+formatSize(a.fileSize)+' · '+dateFmt(a.createdAt)+'</small></div><button class="iconbtn" data-view-file="'+esc(a.id)+'" title="Lihat">↗</button></div>').join(""):'<div class="empty">Belum ada dokumen. Unggah bukti untuk membangun repository aktivitas ini.</div>')+'</div></section>'}
function attachShellEvents(){
 document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>{activePage=b.dataset.page;selectedDoc=null;renderShell();if(window.innerWidth<760)$("sidebar").classList.remove("open")}));
 const gs=$("globalSearch");if(gs)gs.addEventListener("input",()=>{searchText=gs.value;if(activePage==="checklist"||activePage==="repository"){const cur=gs.selectionStart;renderShell();const el=$("globalSearch");if(el){el.focus();el.setSelectionRange(cur,cur)}}});
 const taskSearch=$("taskSearch");if(taskSearch)taskSearch.addEventListener("input",()=>{searchText=taskSearch.value;renderShell();const el=$("taskSearch");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}});
 const stdFilter=$("stdFilter");if(stdFilter)stdFilter.addEventListener("change",()=>{taskFilter.std=stdFilter.value;renderShell()});
 const statusFilter=$("statusFilter");if(statusFilter)statusFilter.addEventListener("change",()=>{taskFilter.status=statusFilter.value;renderShell()});
 const rf=$("repoFilter");if(rf)rf.addEventListener("change",()=>{repoFilter=rf.value;renderShell()});
 document.querySelectorAll("[data-open-task]").forEach(b=>b.addEventListener("click",()=>openTask(b.dataset.openTask)));
 document.querySelectorAll("[data-stdopen]").forEach(b=>b.addEventListener("click",()=>{taskFilter.std=b.dataset.stdopen;activePage="checklist";selectedDoc=null;renderShell()}));
 document.querySelectorAll("[data-status-filter]").forEach(b=>b.addEventListener("click",()=>{taskFilter.status=b.dataset.statusFilter;activePage="checklist";renderShell()}));
 document.querySelectorAll("[data-modal-tab]").forEach(b=>b.addEventListener("click",()=>{modalTab=b.dataset.modalTab;renderShell()}));
 document.querySelectorAll("[data-view-file]").forEach(b=>b.addEventListener("click",()=>viewAttachment(b.dataset.viewFile)));
 document.querySelectorAll("[data-revoke-invite]").forEach(b=>b.addEventListener("click",()=>deleteInvite(b.dataset.revokeInvite)));
 document.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",async()=>{const act=b.dataset.act;if(act==="signout"){await db.auth.signOut();return}if(act==="refresh"){await refreshWorkspace();return}if(act==="closemodal"){selectedDoc=null;renderShell();return}if(act==="togglemenu")$("sidebar").classList.toggle("open")}));
 const back=$("modalback");if(back)back.addEventListener("click",e=>{if(e.target===back){selectedDoc=null;renderShell()}});
 document.querySelectorAll("[data-check]").forEach(c=>c.addEventListener("change",()=>toggleCheck(c.dataset.check,c.checked)));
 const meta=$("taskMetaForm");if(meta)meta.addEventListener("submit",saveTaskMeta);
 const upload=$("taskUploadForm");if(upload)upload.addEventListener("submit",async e=>{e.preventDefault();const form=e.currentTarget;const file=form.querySelector('input[type=file]').files[0];if(!file)return toast("Pilih berkas terlebih dahulu.","error");const data=new FormData(form);await uploadEvidence(form.dataset.docId,file,String(data.get("category")||"Bukti Pendukung"),String(data.get("description")||""));});
 const lu=$("libraryUploadForm");if(lu)lu.addEventListener("submit",async e=>{e.preventDefault();const form=e.currentTarget;const file=form.querySelector('input[type=file]').files[0];const data=new FormData(form);if(!file)return toast("Pilih berkas terlebih dahulu.","error");await uploadEvidence(String(data.get("documentId")),file,String(data.get("category")||"Bukti Pendukung"),String(data.get("description")||""));});
 const inv=$("inviteForm");if(inv)inv.addEventListener("submit",addInvite);
 const pf=$("passwordForm");if(pf)pf.addEventListener("submit",changePassword);
}
function openTask(id){selectedDoc=docs.find(d=>d.id===id)||null;modalTab="checklist";if(selectedDoc)renderShell()}
async function refreshWorkspace(){try{toast("Menyinkronkan data…");await fetchWorkspace();renderShell();toast("Data diperbarui.","success")}catch(e){toast(e.message||"Sinkronisasi gagal","error")}}
async function audit(docId,action,message,fromValue,toValue){try{await db.from("PmkpActivity").insert({id:crypto.randomUUID(),documentId:docId,actor:user.email,action:action,fromValue:fromValue||null,toValue:toValue||null,message:message,createdAt:nowISO()})}catch(e){console.warn("Audit write failed",e)}}
async function toggleCheck(key,checked){
 const d=docs.find(x=>x.id===selectedDoc.id);if(!d)return;
 const data=Object.assign({},d.checklistData||{},{version:1});data.checks=Object.assign({},data.checks||{});const old=!!data.checks[key];data.checks[key]=checked;
 const temp=Object.assign({},d,{checklistData:data});const progress=checklistStats(temp).percent;
 const status=progress===100?"done":progress>0?"in_progress":"todo";
 const result=await db.from("PmkpDocument").update({checklistData:data,progress:progress,status:status,completedAt:progress===100?nowISO():null,updatedAt:nowISO()}).eq("id",d.id);
 if(result.error){toast(result.error.message,"error");return}
 Object.assign(d,{checklistData:data,progress:progress,status:status,completedAt:progress===100?nowISO():null,updatedAt:nowISO()});
 await audit(d.id,"Checklist diperbarui",d.title+" · "+key,old?"checked":"unchecked",checked?"checked":"unchecked");
 await fetchWorkspace();renderShell();
}
async function saveTaskMeta(e){
 e.preventDefault();const f=e.currentTarget,d=selectedDoc;const fd=new FormData(f);
 const payload={pic:String(fd.get("pic")||"").trim()||null,priority:String(fd.get("priority")||"Sedang"),dueDate:String(fd.get("dueDate")||"")||null,notes:String(fd.get("notes")||"").trim()||null,updatedAt:nowISO()};
 const old=d.status;const checkProgress=checklistStats(d).percent;payload.status=checkProgress===100?"done":(checkProgress>0?"in_progress":String(fd.get("status")||"todo"));
 const r=await db.from("PmkpDocument").update(payload).eq("id",d.id);if(r.error)return toast(r.error.message,"error");
 await audit(d.id,"Metadata aktivitas disimpan",d.title+" · PIC: "+(payload.pic||"belum ditetapkan"),old,payload.status);
 await fetchWorkspace();selectedDoc=docs.find(x=>x.id===d.id);renderShell();toast("Detail aktivitas disimpan.","success");
}
async function uploadEvidence(docId,file,category,description){
 if(file.size>20*1024*1024)return toast("Ukuran berkas melebihi batas 20 MB.","error");
 const allowed=/\.(pdf|doc|docx|xls|xlsx|ppt|pptx|txt|csv|png|jpe?g|webp)$/i;
 if(!allowed.test(file.name))return toast("Format berkas tidak didukung.","error");
 const d=docs.find(x=>x.id===docId);if(!d)return toast("Aktivitas tujuan tidak ditemukan.","error");
 toast("Mengunggah berkas…");
 const safeName=file.name.normalize("NFKD").replace(/[^a-zA-Z0-9._-]+/g,"_").slice(-130);
 const path=user.id+"/"+docId+"/"+Date.now()+"-"+safeName;
 try{
  const upload=await db.storage.from(BUCKET).upload(path,file,{contentType:file.type||"application/octet-stream",upsert:false});
  if(upload.error)throw upload.error;
  const record={id:crypto.randomUUID(),documentId:docId,filename:file.name,filePath:path,fileSize:file.size,mimeType:file.type||null,uploadedBy:user.email,category:category,description:description||null,createdAt:nowISO()};
  const saved=await db.from("PmkpAttachment").insert(record);if(saved.error){await db.storage.from(BUCKET).remove([path]);throw saved.error}
  await audit(docId,"Bukti diunggah",category+" · "+file.name,null,path);
  await fetchWorkspace();selectedDoc=docs.find(x=>x.id===docId)||null;renderShell();toast("Bukti tersimpan di repository privat.","success");
 }catch(err){toast(err.message||"Unggah gagal. Periksa koneksi dan akses storage.","error")}
}
async function viewAttachment(id){
 const a=attachments.find(x=>x.id===id);if(!a)return toast("Metadata berkas tidak ditemukan.","error");
 const win=window.open("about:blank","_blank","noopener,noreferrer");
 try{const r=await db.storage.from(BUCKET).createSignedUrl(a.filePath,600);if(r.error)throw r.error;if(win)win.location.href=r.data.signedUrl;else window.location.href=r.data.signedUrl;}catch(err){if(win)win.close();toast(err.message||"Pratinjau gagal dibuka.","error")}
}
async function addInvite(e){
 e.preventDefault();if(!isAdmin())return;const form=e.currentTarget,fd=new FormData(form);const email=String(fd.get("email")||"").trim().toLowerCase();
 if(email===user.email)return toast("Email administrator aktif sudah terdaftar.","error");
 const r=await db.from("PmkpAllowedUser").insert({email:email,full_name:String(fd.get("full_name")||"").trim(),role:String(fd.get("role")||"member"),active:true,created_by:user.id});
 if(r.error)return toast(r.error.message,"error");
 form.reset();await fetchWorkspace();renderShell();toast("Email diizinkan. Pengguna dapat mengaktifkan akun dari halaman login.","success");
}
async function deleteInvite(id){
 if(!isAdmin())return;const i=invites.find(x=>x.id===id);if(!i)return;
 if(!confirm("Hapus "+i.email+" dari daftar undangan? Ini tidak mencabut sesi akun yang sudah terbentuk."))return;
 const r=await db.from("PmkpAllowedUser").delete().eq("id",id);if(r.error)return toast(r.error.message,"error");
 await fetchWorkspace();renderShell();toast("Email dihapus dari daftar undangan.","success");
}
async function changePassword(e){
 e.preventDefault();const f=e.currentTarget;const fd=new FormData(f),pw=String(fd.get("password")||""),confirmPw=String(fd.get("confirm")||"");
 if(pw!==confirmPw)return toast("Kata sandi baru tidak sama.","error");
 if(pw.length<14)return toast("Gunakan kata sandi minimal 14 karakter.","error");
 const r=await db.auth.updateUser({password:pw});if(r.error)return toast(r.error.message,"error");
 await db.auth.updateUser({data:Object.assign({},user.user_metadata||{},{must_change_password:false})});
 f.reset();const a=await db.auth.getUser();user=a.data.user||user;renderShell();toast("Kata sandi berhasil diganti.","success");
}
db.auth.onAuthStateChange((event,session)=>{
 if(session&&session.user){user=session.user;}
 else if(event==="SIGNED_OUT"){user=null;docs=[];attachments=[];activities=[];invites=[];selectedDoc=null;renderAuth("login")}
});
document.addEventListener("click",e=>{
 const mode=e.target.closest("[data-auth-mode]");if(mode){renderAuth(mode.dataset.authMode);return}
});
async function init(){
 try{const {data,error}=await db.auth.getSession();if(error)throw error;if(data.session){user=data.session.user;await boot()}else renderAuth("login")}
 catch(e){renderAuth("login", "Koneksi autentikasi belum dapat diperiksa: "+(e.message||"periksa koneksi"))}
}
init();
})();
</script>
</body>
</html>
